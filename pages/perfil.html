<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Perfil | Clínica Bem Estar</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
  <div id="loading-screen"><div class="spinner"></div></div>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <a href="../index.html" class="logo"><i class="fa-solid fa-staff-snake"></i> Bem Estar</a>
      <nav class="sidebar-nav">
        <a href="dashboard.html"><i class="fa-solid fa-gauge"></i> Início</a>
        <a href="agendar.html"><i class="fa-solid fa-calendar-plus"></i> Agendar Consulta</a>
        <a href="minhas-consultas.html"><i class="fa-solid fa-calendar-check"></i> Minhas Consultas</a>
        <a href="perfil.html" class="active"><i class="fa-solid fa-user"></i> Meu Perfil</a>
      </nav>
      <div class="sidebar-footer">
        <button id="logout-btn" class="btn btn-outline btn-sm" style="width:100%;"><i class="fa-solid fa-right-from-bracket"></i> Sair</button>
      </div>
    </aside>
    <main class="main-content" style="max-width:640px;">
      <div class="content-header">
        <button id="sidebar-toggle" class="mobile-menu-btn btn btn-outline btn-sm"><i class="fa-solid fa-bars"></i></button>
        <h1>Meu Perfil</h1>
      </div>

      <div class="card" style="margin-bottom:1.5rem;">
        <h3 style="margin-bottom:1rem;">Dados pessoais</h3>
        <form id="perfil-form">
          <div class="form-group"><label for="nome">Nome</label><input type="text" id="nome" class="form-control" required></div>
          <div class="form-group"><label for="telefone">Telefone</label><input type="text" id="telefone" class="form-control" required></div>
          <div class="form-group"><label for="email">E-mail</label><input type="email" id="email" class="form-control" disabled></div>
          <button type="submit" class="btn btn-primary">Salvar alterações</button>
        </form>
      </div>

      <div class="card">
        <h3 style="margin-bottom:1rem;">Alterar senha</h3>
        <form id="senha-form">
          <div class="form-group"><label for="nova-senha">Nova senha</label><input type="password" id="nova-senha" class="form-control" required><span class="form-error"></span></div>
          <button type="submit" class="btn btn-outline">Atualizar senha</button>
        </form>
      </div>
    </main>
  </div>
  <div id="toast-container"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../config/supabase-config.js"></script>
  <script src="../js/utils/toast.js"></script>
  <script src="../js/utils/validators.js"></script>
  <script src="../js/modules/auth.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/pages/perfil.js"></script>
</body>
</html>
