<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Senha | Clínica Bem Estar</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
  <div id="loading-screen"><div class="spinner"></div></div>
  <main class="auth-page">
    <div class="auth-card">
      <a href="../index.html" class="logo" style="display:flex;justify-content:center;"><i class="fa-solid fa-staff-snake"></i> Clínica Bem Estar</a>
      <h1>Recuperar senha</h1>
      <p class="subtitle">Informe seu e-mail para receber o link de redefinição.</p>
      <form id="recuperar-form">
        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" class="form-control" required>
          <span class="form-error"></span>
        </div>
        <button type="submit" class="btn btn-primary" id="submit-btn">Enviar link</button>
      </form>
      <div class="auth-links"><p><a href="login.html">Voltar para o login</a></p></div>
    </div>
  </main>
  <div id="toast-container"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../config/supabase-config.js"></script>
  <script src="../js/utils/toast.js"></script>
  <script src="../js/utils/validators.js"></script>
  <script src="../js/modules/auth.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.getElementById("recuperar-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email");
      const btn = document.getElementById("submit-btn");
      if (!isValidEmail(email.value)) { showFieldError(email, "E-mail inválido."); return; }
      clearFieldError(email);
      btn.disabled = true; btn.textContent = "Enviando...";
      try {
        await Auth.recuperarSenha(email.value.trim());
        showToast("Se o e-mail existir, um link foi enviado.", "success");
      } catch (err) {
        showToast(err.message, "error");
      } finally {
        btn.disabled = false; btn.textContent = "Enviar link";
      }
    });
  </script>
</body>
</html>
