<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo | Clínica Bem Estar</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
  <div id="loading-screen"><div class="spinner"></div></div>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <a href="../index.html" class="logo"><i class="fa-solid fa-staff-snake"></i> Admin</a>
      <nav class="sidebar-nav">
        <a href="admin-dashboard.html" class="active"><i class="fa-solid fa-gauge"></i> Dashboard</a>
        <a href="admin-agendamentos.html"><i class="fa-solid fa-calendar-check"></i> Agendamentos</a>
        <a href="admin-pacientes.html"><i class="fa-solid fa-users"></i> Pacientes</a>
        <a href="admin-disponibilidade.html"><i class="fa-solid fa-clock"></i> Disponibilidade</a>
      </nav>
      <div class="sidebar-footer">
        <button id="logout-btn" class="btn btn-outline btn-sm" style="width:100%;"><i class="fa-solid fa-right-from-bracket"></i> Sair</button>
      </div>
    </aside>
    <main class="main-content">
      <div class="content-header">
        <button id="sidebar-toggle" class="mobile-menu-btn btn btn-outline btn-sm"><i class="fa-solid fa-bars"></i></button>
        <h1>Dashboard</h1>
      </div>

      <div class="stats-grid">
        <div class="card stat-card"><div class="icon"><i class="fa-solid fa-calendar-day"></i></div><div><div class="value" id="stat-hoje">0</div><div class="label">Consultas hoje</div></div></div>
        <div class="card stat-card"><div class="icon warning"><i class="fa-solid fa-hourglass-half"></i></div><div><div class="value" id="stat-pendentes">0</div><div class="label">Aguardando confirmação</div></div></div>
        <div class="card stat-card"><div class="icon green"><i class="fa-solid fa-users"></i></div><div><div class="value" id="stat-pacientes">0</div><div class="label">Pacientes cadastrados</div></div></div>
        <div class="card stat-card"><div class="icon"><i class="fa-solid fa-calendar-check"></i></div><div><div class="value" id="stat-total">0</div><div class="label">Total de consultas</div></div></div>
      </div>

      <div class="card">
        <h3 style="margin-bottom:1rem;">Calendário completo</h3>
        <div id="calendar-container"></div>
      </div>
    </main>
  </div>
  <div id="toast-container"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
  <script src="../config/supabase-config.js"></script>
  <script src="../js/utils/toast.js"></script>
  <script src="../js/modules/auth.js"></script>
  <script src="../js/modules/admin.js"></script>
  <script src="../js/modules/booking.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/pages/admin-dashboard.js"></script>
</body>
</html>
