<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Erro interno | Clínica Bem Estar</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<style>
  .error-page{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;background:#fbeecb;}
  .error-page i{font-size:3rem;color:var(--color-warning);margin-bottom:1rem;}
  .error-page h1{font-size:2.2rem;margin-bottom:0.5rem;}
  .error-page p{color:var(--color-gray-600);margin-bottom:1.5rem;}
</style>
</head>
<body>
  <div class="error-page">
    <i class="fa-solid fa-triangle-exclamation"></i>
    <h1>500 — Algo deu errado</h1>
    <p>Ocorreu um erro inesperado no servidor. Tente novamente em instantes.</p>
    <a href="../index.html" class="btn btn-primary">Voltar para o início</a>
  </div>
</body>
</html>
