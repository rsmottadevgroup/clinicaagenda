<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redefinir Senha | Clínica Bem Estar</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
  <div id="loading-screen"><div class="spinner"></div></div>
  <main class="auth-page">
    <div class="auth-card">
      <h1>Nova senha</h1>
      <p class="subtitle">Defina uma nova senha para sua conta.</p>
      <form id="redefinir-form">
        <div class="form-group password-toggle">
          <label for="nova-senha">Nova senha</label>
          <input type="password" id="nova-senha" class="form-control" required>
          <i class="fa-solid fa-eye" id="toggle-senha"></i>
          <span class="form-error"></span>
        </div>
        <button type="submit" class="btn btn-primary" id="submit-btn">Salvar nova senha</button>
      </form>
    </div>
  </main>
  <div id="toast-container"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../config/supabase-config.js"></script>
  <script src="../js/utils/toast.js"></script>
  <script src="../js/utils/validators.js"></script>
  <script src="../js/modules/auth.js"></script>
  <script src="../js/app.js"></script>
  <script>
    // O Supabase já autentica automaticamente a sessão de recuperação via link do e-mail.
    document.getElementById("redefinir-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const senha = document.getElementById("nova-senha");
      const btn = document.getElementById("submit-btn");
      if (!isStrongPassword(senha.value)) { showFieldError(senha, "Mínimo 8 caracteres, com letras e números."); return; }
      clearFieldError(senha);
      btn.disabled = true; btn.textContent = "Salvando...";
      try {
        await Auth.atualizarSenha(senha.value);
        showToast("Senha atualizada! Faça login novamente.", "success");
        setTimeout(() => (window.location.href = "login.html"), 1200);
      } catch (err) {
        showToast(err.message, "error");
        btn.disabled = false; btn.textContent = "Salvar nova senha";
      }
    });
    document.getElementById("toggle-senha").addEventListener("click", (e) => {
      const input = document.getElementById("nova-senha");
      const isPassword = input.type === "password";
      input.type = isPassword ? "text" : "password";
      e.target.classList.toggle("fa-eye-slash", isPassword);
    });
  </script>
</body>
</html>
