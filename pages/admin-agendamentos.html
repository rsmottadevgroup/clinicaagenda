<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendamentos | Painel Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
  <div id="loading-screen"><div class="spinner"></div></div>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <a href="../index.html" class="logo"><i class="fa-solid fa-staff-snake"></i> Admin</a>
      <nav class="sidebar-nav">
        <a href="admin-dashboard.html"><i class="fa-solid fa-gauge"></i> Dashboard</a>
        <a href="admin-agendamentos.html" class="active"><i class="fa-solid fa-calendar-check"></i> Agendamentos</a>
        <a href="admin-pacientes.html"><i class="fa-solid fa-users"></i> Pacientes</a>
        <a href="admin-disponibilidade.html"><i class="fa-solid fa-clock"></i> Disponibilidade</a>
      </nav>
      <div class="sidebar-footer">
        <button id="logout-btn" class="btn btn-outline btn-sm" style="width:100%;"><i class="fa-solid fa-right-from-bracket"></i> Sair</button>
      </div>
    </aside>
    <main class="main-content">
      <div class="content-header">
        <button id="sidebar-toggle" class="mobile-menu-btn btn btn-outline btn-sm"><i class="fa-solid fa-bars"></i></button>
        <h1>Agendamentos</h1>
        <div style="display:flex;gap:0.6rem;flex-wrap:wrap;">
          <select id="filtro-status" class="form-control" style="width:auto;">
            <option value="">Todos os status</option>
            <option value="aguardando">Aguardando</option>
            <option value="confirmado">Confirmado</option>
            <option value="recusado">Recusado</option>
            <option value="cancelado">Cancelado</option>
          </select>
          <button id="exportar-csv" class="btn btn-outline btn-sm"><i class="fa-solid fa-file-export"></i> Exportar</button>
        </div>
      </div>
      <div class="card">
        <div style="overflow-x:auto;">
          <table class="data-table">
            <thead><tr><th>Paciente</th><th>Telefone</th><th>Data</th><th>Horário</th><th>Status</th><th>Ações</th></tr></thead>
            <tbody id="agendamentos-tbody"><tr><td colspan="6">Carregando...</td></tr></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal de detalhes -->
  <div class="modal-overlay hidden" id="modal-detalhes">
    <div class="modal-box">
      <button class="modal-close" id="fechar-modal"><i class="fa-solid fa-xmark"></i></button>
      <h3>Detalhes da solicitação</h3>
      <p style="margin-top:0.8rem;"><strong>Paciente:</strong> <span id="det-nome"></span></p>
      <p><strong>Telefone:</strong> <span id="det-telefone"></span></p>
      <p><strong>Data:</strong> <span id="det-data"></span></p>
      <p><strong>Horário:</strong> <span id="det-horario"></span></p>
      <p><strong>Observações:</strong> <span id="det-obs"></span></p>
      <div style="display:flex;gap:0.6rem;margin-top:1.2rem;">
        <button class="btn btn-success" id="btn-confirmar">Confirmar</button>
        <button class="btn btn-danger" id="btn-recusar">Recusar</button>
        <button class="btn btn-outline" id="btn-cancelar">Cancelar</button>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../config/supabase-config.js"></script>
  <script src="../js/utils/toast.js"></script>
  <script src="../js/modules/auth.js"></script>
  <script src="../js/modules/admin.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/pages/admin-agendamentos.js"></script>
</body>
</html>
