<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Conta | Clínica Bem Estar</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
  <div id="loading-screen"><div class="spinner"></div></div>

  <main class="auth-page">
    <div class="auth-card">
      <a href="../index.html" class="logo" style="display:flex;justify-content:center;"><i class="fa-solid fa-staff-snake"></i> Clínica Bem Estar</a>
      <h1>Criar conta</h1>
      <p class="subtitle">Cadastre-se para agendar suas consultas.</p>

      <form id="cadastro-form">
        <div class="form-group">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" class="form-control" required>
        </div>
        <div class="form-group">
          <label for="telefone">Telefone / WhatsApp</label>
          <input type="text" id="telefone" class="form-control" placeholder="(11) 99999-9999" required>
          <span class="form-error"></span>
        </div>
        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" class="form-control" required>
          <span class="form-error"></span>
        </div>
        <div class="form-group password-toggle">
          <label for="senha">Senha</label>
          <input type="password" id="senha" class="form-control" required>
          <i class="fa-solid fa-eye" id="toggle-senha"></i>
          <span class="form-error"></span>
        </div>
        <button type="submit" class="btn btn-primary" id="submit-btn">Criar conta</button>
      </form>

      <div class="auth-links">
        <p>Já tem conta? <a href="login.html">Entrar</a></p>
      </div>
    </div>
  </main>

  <div id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../config/supabase-config.js"></script>
  <script src="../js/utils/toast.js"></script>
  <script src="../js/utils/validators.js"></script>
  <script src="../js/modules/auth.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/pages/cadastro.js"></script>
</body>
</html>
