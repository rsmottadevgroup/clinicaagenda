<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendar Consulta | Clínica Bem Estar</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
  <div id="loading-screen"><div class="spinner"></div></div>

  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <a href="../index.html" class="logo"><i class="fa-solid fa-staff-snake"></i> Bem Estar</a>
      <nav class="sidebar-nav">
        <a href="dashboard.html"><i class="fa-solid fa-gauge"></i> Início</a>
        <a href="agendar.html" class="active"><i class="fa-solid fa-calendar-plus"></i> Agendar Consulta</a>
        <a href="minhas-consultas.html"><i class="fa-solid fa-calendar-check"></i> Minhas Consultas</a>
        <a href="perfil.html"><i class="fa-solid fa-user"></i> Meu Perfil</a>
      </nav>
      <div class="sidebar-footer">
        <button id="logout-btn" class="btn btn-outline btn-sm" style="width:100%;"><i class="fa-solid fa-right-from-bracket"></i> Sair</button>
      </div>
    </aside>

    <main class="main-content">
      <div class="content-header">
        <button id="sidebar-toggle" class="mobile-menu-btn btn btn-outline btn-sm"><i class="fa-solid fa-bars"></i></button>
        <h1>Agendar Consulta</h1>
      </div>

      <p style="color:var(--color-gray-600);margin-bottom:1rem;">
        <span style="background:var(--color-blue-light);padding:2px 8px;border-radius:6px;">Azul</span> disponível ·
        <span style="background:#f6d8d8;padding:2px 8px;border-radius:6px;">Vermelho</span> lotado ·
        <span style="background:var(--color-gray-100);padding:2px 8px;border-radius:6px;">Cinza</span> indisponível
      </p>

      <div id="calendar-container"></div>
    </main>
  </div>

  <!-- ===================== MODAL DE HORÁRIOS ===================== -->
  <div class="modal-overlay hidden" id="modal-horarios">
    <div class="modal-box">
      <button class="modal-close" id="fechar-modal" aria-label="Fechar"><i class="fa-solid fa-xmark"></i></button>
      <h3 id="modal-data-titulo">Horários disponíveis</h3>
      <div class="time-slots" id="time-slots"></div>
      <div class="form-group">
        <label for="observacoes">Observações (opcional)</label>
        <textarea id="observacoes" class="form-control" rows="3" placeholder="Ex: primeira consulta, retorno, sintomas..."></textarea>
      </div>
      <button class="btn btn-primary" id="confirmar-agendamento" style="width:100%;" disabled>Confirmar agendamento</button>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
  <script src="../config/supabase-config.js"></script>
  <script src="../config/firebase-config.js"></script>
  <script src="../js/utils/toast.js"></script>
  <script src="../js/utils/validators.js"></script>
  <script src="../js/modules/auth.js"></script>
  <script src="../js/modules/booking.js"></script>
  <script src="../js/modules/notifications.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/pages/agendar.js"></script>
</body>
</html>
